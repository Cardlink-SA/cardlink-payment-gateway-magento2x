<div class="payment-method" id="cardlink_checkout_applepay--payment-method"
    data-bind="css: {'_active': (getCode() == isChecked()) }">
    <div class="payment-method-title field choice">
        <input type="radio" name="payment[method]" class="radio"
            data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()" />
        <label data-bind="attr: {'for': getCode()}" class="label"><span data-bind="text: getTitle()"></span></label>
    </div>
    <div class="payment-method-content cardlink_checkout--payment-method-content">

        <!-- ko if: canDisplayLogoInTitle() -->
        <img data-bind="attr: {src: getLogoUrl(), alt: $t(getTitle())}"
            id="cardlink_checkout_applepay--payment-method-logo" />
        <!-- /ko -->

        <!-- ko if: getDescription() -->
        <div class="cardlink-checkout-payment-method-description" data-bind="html: getDescription()"></div>
        <!-- /ko -->

        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() -->
        <!-- /ko -->
        <!-- /ko -->

        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() -->
            <!-- /ko -->
            <!-- /ko -->
        </div>

        <form id="cardlink-checkout-applepay-options-form" class="form form-cardlink-checkout-options-order"
            data-role="cardlink-checkout-applepay-options-form" target="_top">
            <fieldset class="fieldset payment method" data-bind='attr: {id: "payment_form_" + getCode()}'>
            </fieldset>
        </form>

        <!-- Intentionally outside the <form> so clicking the Apple Pay button does not
             trigger a form submit, which would consume browser user activation and cause
             PaymentRequest.show() to throw SecurityError. -->
        <div id="applePayDiv">
            <!-- Apple Pay button will be rendered here by the Apple Pay Direct script -->
        </div>

        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() -->
            <!-- /ko -->
            <!-- /ko -->
        </div>

        <!-- Place Order button intentionally removed: the Apple Pay button
             inside #applePayDiv triggers the payment flow directly. -->
    </div>

    <!-- Modal for 3DS authentication -->
    <div id="cardlink_checkout_applepay--modal" style="display:none;position:fixed;z-index:999999999;padding-top:50px;left:0;top:0;width:100%;height:calc(100% - 50px);overflow:auto;background-color:rgba(0,0,0,0.4)">
        <!-- Modal content -->
        <div id="cardlink_checkout_applepay--modal-content" style="margin:0 auto;width:90%;height:95%;background:white;border:2px solid lightgray">
            <iframe id="cardlink_checkout_applepay--modal-iframe"
                    name="cardlink_checkout_applepay_3ds_iframe" src="" style="width:100%;height:100%;border:none"></iframe>
        </div>
        <!-- Modal content -->
    </div>
    <!-- Modal -->

</div>
